name: ci

on:
  push:
    branches: [main]
    paths-ignore: ["jobs/**", "**.md"]
  pull_request:

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - run: uv sync --frozen
      - name: Lint
        run: uv run ruff check .
      - name: Format
        run: uv run ruff format --check .
      - name: Types
        run: uv run mypy
      - name: Tests
        run: uv run pytest -q

  web:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
      - name: Lint
        run: npm run lint
      - name: Types
        run: npm run typecheck
      - name: Format
        run: npm run format:check
      - name: Tests
        run: npm test

  spark:
    # PySpark parity tests (ADR 0006); the runner image ships a Java runtime.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - run: uv sync --frozen --extra bigdata
      - name: Spark parity tests
        run: uv run pytest -q tests/test_spark.py

  postgis:
    # PostGIS loader against the same image as docker-compose.yml.
    runs-on: ubuntu-latest
    services:
      db:
        image: postgis/postgis:17-3.5
        env:
          POSTGRES_DB: oliveye
          POSTGRES_USER: oliveye
          POSTGRES_PASSWORD: ci-only
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U oliveye -d oliveye"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      OLIVEYE_TEST_DATABASE_URL: postgresql+psycopg://oliveye:ci-only@localhost:5432/oliveye
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - run: uv sync --frozen --extra db
      - name: PostGIS loader tests
        run: uv run pytest -q tests/test_db.py
